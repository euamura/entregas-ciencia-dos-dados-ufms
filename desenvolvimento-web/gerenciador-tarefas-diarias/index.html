<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas Diárias</title>

    <!-- Vínculo com o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <center>
        <h1>Lista de Tarefas Diárias</h1>
        <h3>Organize seu dia de forma prática</h3>
    </center>

    <div id="app"></div>

    <!-- Adicionando o script do Vue.JS -->
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    
    <!-- Script principal -->
    <script>
        new Vue({
            el: '#app',

            template: `   
           <div class="container">
                <h2>Cadastro de Tarefas</h2>
                <hr>
                <div class="form-todo form-group">
                    <p>
                        <input type="text" placeholder="Identificação da tarefa" name="idTarefa" class="form-control" v-model="idTarefa">
                    </p>
                    <p>
                        <textarea placeholder="Breve descrição da tarefa" name="descricao" class="form-control" v-model="descricao"></textarea>
                    </p>
                    <p>
                        <input type="datetime-local" name="dataHora" class="form-control" v-model="dataHora">
                    </p>
                    <button v-on:click="addTarefa" type="submit" class="btn btn-primary">Adicionar Tarefa</button>
                </div>   

                <!-- Filtro de exibição -->
                <div class="mt-4">
                    <label><strong>Filtrar tarefas:</strong></label>
                    <select v-model="filtro" class="form-select w-auto d-inline-block ms-2">
                        <option value="todas">Todas</option>
                        <option value="pendentes">Pendentes</option>
                        <option value="concluidas">Concluídas</option>
                    </select>
                </div>

                <!-- Lista de tarefas -->
                <div class="list-group mt-3">
                    <div class="list-group-item" 
                         v-for="(tarefa, index) in tarefasFiltradas" 
                         :key="index"
                         :class="{ 'list-group-item-success': tarefa.concluida }">

                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="tarefa-id"><strong>{{ tarefa.idTarefa }}</strong></span>
                                <p>{{ tarefa.descricao }}</p>
                                <p><strong>Data e Hora:</strong> {{ formatarDataHora(tarefa.dataHora) }}</p>
                            </div>

                            <div class="text-end">
                                <button v-if="!tarefa.concluida" class="btn btn-success btn-sm me-2" @click="concluirTarefa(index)">Concluir</button>
                                <button v-if="tarefa.concluida" class="btn btn-secondary btn-sm me-2" @click="reabrirTarefa(index)">Reabrir</button>
                                <button class="btn btn-danger btn-sm" @click="removeTarefa(index)">Excluir</button>
                            </div>
                        </div>
                    </div>
                </div>
                <hr> 
            </div> `,

            data() {
                return {
                    tarefas: [],
                    idTarefa: '',
                    descricao: '',
                    dataHora: '',
                    filtro: 'todas'
                }
            },

            computed: {
                // Retorna tarefas de acordo com o filtro selecionado
                tarefasFiltradas() {
                    if (this.filtro === 'pendentes') {
                        return this.tarefas.filter(t => !t.concluida);
                    } else if (this.filtro === 'concluidas') {
                        return this.tarefas.filter(t => t.concluida);
                    }
                    return this.tarefas;
                }
            },

            methods: {
                // Adicionar nova tarefa
                addTarefa() {
                    if (this.idTarefa.trim() === '' || this.descricao.trim() === '' || this.dataHora.trim() === '') {
                        return;
                    }

                    this.tarefas.push({
                        idTarefa: this.idTarefa,
                        descricao: this.descricao,
                        dataHora: this.dataHora,
                        concluida: false
                    });

                    this.salvarLocalStorage();

                    // Limpa os campos
                    this.idTarefa = '';
                    this.descricao = '';
                    this.dataHora = '';
                },

                // Marcar tarefa como concluída
                concluirTarefa(index) {
                    this.tarefas[index].concluida = true;
                    this.salvarLocalStorage();
                },

                // Reabrir tarefa concluída
                reabrirTarefa(index) {
                    this.tarefas[index].concluida = false;
                    this.salvarLocalStorage();
                },

                // Remover tarefa
                removeTarefa(index) {
                    this.tarefas.splice(index, 1);
                    this.salvarLocalStorage();
                },

                // Formatar data/hora
                formatarDataHora(dataHora) {
                    const data = new Date(dataHora);
                    return data.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
                },

                // Salvar tarefas no LocalStorage
                salvarLocalStorage() {
                    localStorage.setItem('tarefas', JSON.stringify(this.tarefas));
                },

                // Carregar tarefas salvas
                carregarLocalStorage() {
                    const tarefasSalvas = localStorage.getItem('tarefas');
                    if (tarefasSalvas) {
                        this.tarefas = JSON.parse(tarefasSalvas);
                    }
                }
            },

            mounted() {
                // Carrega tarefas salvas ao iniciar
                this.carregarLocalStorage();
            }
        })
    </script>

</body>
</html>
